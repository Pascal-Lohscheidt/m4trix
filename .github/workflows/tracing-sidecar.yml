# Builds and pushes ghcr.io/pascal-lohscheidt/m4trix-tracing-sidecar for every @m4trix/tracing
# release. CircleCI pushes the release tag only after `npm publish` succeeded
# (scripts/push-release-tag.ts), so a tag means "this version is on npm" and the image gets the
# same version. Run it by hand to (re)build an existing release, e.g. one whose image is missing.
#
# The job can push images, so every action is pinned to a commit (the comment names its version).
name: Tracing sidecar image

on:
  push:
    tags:
      - '@m4trix/tracing@*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. @m4trix/tracing@0.11.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: tracing-sidecar-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pascal-lohscheidt/m4trix-tracing-sidecar

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the release
        id: release
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^@m4trix/tracing@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a tracing release tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#@m4trix/tracing@}"
          # Same guard as the tag-before-publish order in CircleCI: never ship an image for a
          # version that is not on npm. CircleCI pushes the tag right after `npm publish`, and the
          # registry can take a few minutes to show the new version, so wait up to 10 minutes.
          for attempt in $(seq 1 40); do
            if [ "$(npm view "@m4trix/tracing@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then break; fi
            if [ "$attempt" = 40 ]; then
              echo "::error::@m4trix/tracing@$VERSION is not on npm"
              exit 1
            fi
            echo "@m4trix/tracing@$VERSION is not on npm yet (attempt $attempt/40); retrying in 15 s"
            sleep 15
          done
          # `latest` follows the newest release only, so rebuilding an older one does not move it.
          NEWEST=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY.git" 'refs/tags/@m4trix/tracing@*' \
            | sed 's#.*refs/tags/@m4trix/tracing@##' | sort -V | tail -1)
          TAGS="$IMAGE:$VERSION"
          if [ "$VERSION" = "$NEWEST" ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Tracing sidecar $VERSION (newest release: $NEWEST) → $TAGS"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image to scan (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out tag, so packages/tracing/Dockerfile.dockerignore applies.
          context: .
          file: packages/tracing/Dockerfile
          platforms: linux/amd64
          load: true
          tags: m4trix-tracing-sidecar:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing is pushed while a HIGH or CRITICAL vulnerability with a fix is found, like the npm
      # audit gate in CircleCI. Covers the Debian packages, the npm that ships with Node, and the npm
      # packages bundled into the CLI (listed in trace-shipper-cli.cdx.json). Findings without a fix
      # cannot be acted on and are skipped.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: m4trix-tracing-sidecar:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Same build from the cache, for both platforms; the arm64 image has the same packages.
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/tracing/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.title=m4trix-tracing-sidecar
            org.opencontainers.image.description=Ships @m4trix/tracing traces from a shared volume to DynamoDB and S3
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
