version: 2.1

# To push tags, add a deploy key with write access:
# 1. Generate SSH key: ssh-keygen -t ed25519 -C "circleci" -f circleci_deploy_key -N ""
# 2. Add public key (circleci_deploy_key.pub) to GitHub: Repo > Settings > Deploy keys > Add (enable "Allow write access")
# 3. Add private key to CircleCI: Project > Settings > SSH Keys > Add (paste circleci_deploy_key contents)
# CircleCI automatically adds project SSH keys to the agent; no add_ssh_keys step needed.

commands:
  npm-trusted-publishing:
    description: >
      Authenticate `npm publish` via npm trusted publishing (CircleCI OIDC) instead of a stored
      token. Requires a CircleCI trusted publisher configured for the package on npmjs.com.
    steps:
      - run:
          name: Set up npm trusted publishing (OIDC)
          command: |
            # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14, see the job image).
            sudo npm install -g npm@^11.5.1
            echo "node $(node --version), npm $(npm --version)"
            NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            if [ -z "${NPM_ID_TOKEN}" ]; then
              echo "ERROR: could not obtain a CircleCI OIDC token."
              exit 1
            fi
            # npm exchanges this for a short-lived publish token during `npm publish`.
            echo "export NPM_ID_TOKEN=${NPM_ID_TOKEN}" >> "$BASH_ENV"

  push-release-tag:
    description: Push the release tag after a successful publish.
    parameters:
      scope:
        type: string
    steps:
      - run:
          name: Push release tag
          command: pnpm exec jiti scripts/push-release-tag.ts << parameters.scope >>

jobs:
  test:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Run tests
          command: pnpm exec vitest --typecheck --run --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      - run:
          name: Generate coverage
          command: pnpm run test:coverage
      - store_artifacts:
          path: coverage
          destination: coverage

  build:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Build packages
          command: pnpm exec turbo run build
      - store_artifacts:
          path: dist
          destination: dist

  audit:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          # Fails only on high/critical advisories in production dependencies of published
          # packages; devDependencies, website and examples are ignored. Transient registry
          # errors are retried inside the script.
          name: Audit production dependencies of published packages
          command: pnpm exec jiti scripts/audit-deployed-packages.ts

  publish-core:
    docker:
      - image: cimg/node:22.23.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Check if core package should be published
          command: pnpm exec jiti scripts/check-package-scope.ts core || circleci step halt
      - run:
          name: Bump version and create local tag
          command: pnpm exec jiti scripts/bump-and-tag.ts core
      - run:
          name: Build core package
          command: pnpm run package:build
      - npm-trusted-publishing
      - run:
          name: Publish core package
          command: pnpm run package:publish
      - push-release-tag:
          scope: core

  publish-evals:
    docker:
      - image: cimg/node:22.23.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Check if evals package should be published
          command: pnpm exec jiti scripts/check-package-scope.ts evals || circleci step halt
      - run:
          name: Bump version and create local tag
          command: pnpm exec jiti scripts/bump-and-tag.ts evals
      - run:
          name: Build evals package
          command: pnpm run evals:build
      - npm-trusted-publishing
      - run:
          name: Publish evals package
          command: pnpm run evals:publish
      - push-release-tag:
          scope: evals

  publish-stream:
    docker:
      - image: cimg/node:22.23.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Check if stream package should be published
          command: pnpm exec jiti scripts/check-package-scope.ts stream || circleci step halt
      - run:
          name: Bump version and create local tag
          command: pnpm exec jiti scripts/bump-and-tag.ts stream
      - run:
          name: Build stream package
          command: pnpm run stream:build
      - npm-trusted-publishing
      - run:
          name: Publish stream package
          command: pnpm run stream:publish
      - push-release-tag:
          scope: stream

  publish-react:
    docker:
      - image: cimg/node:22.23.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Check if react package should be published
          command: pnpm exec jiti scripts/check-package-scope.ts react || circleci step halt
      - run:
          name: Bump version and create local tag
          command: pnpm exec jiti scripts/bump-and-tag.ts react
      - run:
          name: Build react package
          command: pnpm run react:build
      - npm-trusted-publishing
      - run:
          name: Publish react package
          command: pnpm run react:publish
      - push-release-tag:
          scope: react

  publish-tracing:
    docker:
      - image: cimg/node:22.23.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Check if tracing package should be published
          command: pnpm exec jiti scripts/check-package-scope.ts tracing || circleci step halt
      - run:
          name: Bump version and create local tag
          command: pnpm exec jiti scripts/bump-and-tag.ts tracing
      - run:
          name: Build tracing package
          command: pnpm run tracing:build
      - npm-trusted-publishing
      - run:
          name: Publish tracing package
          command: pnpm run tracing:publish
      - push-release-tag:
          scope: tracing

  publish-tracing-sidecar:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Check if publish-tracing released this commit
          # publish-tracing tags the commit it released before this job starts, so a tracing tag on
          # HEAD means "build the image for that version". (Diffing against the latest tag, as the
          # package jobs do, is always empty at this point and used to skip every image build.)
          command: |
            git fetch --quiet --force --tags origin
            TAG=$(git tag --points-at HEAD --list '@m4trix/tracing@*' --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No @m4trix/tracing release tag on this commit; skipping the sidecar image."
              circleci step halt
              exit 0
            fi
            echo "export TRACING_VERSION=${TAG#@m4trix/tracing@}" >> "$BASH_ENV"
            echo "Tracing sidecar version: ${TAG#@m4trix/tracing@}"
      - run:
          name: Log in to GHCR
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - run:
          name: Build and push sidecar image
          command: |
            IMAGE=ghcr.io/pascal-lohscheidt/m4trix-tracing-sidecar
            # BuildKit honours packages/tracing/Dockerfile.dockerignore (keeps the context small).
            DOCKER_BUILDKIT=1 docker build -f packages/tracing/Dockerfile -t "${IMAGE}:${TRACING_VERSION}" -t "${IMAGE}:latest" .
            docker push "${IMAGE}:${TRACING_VERSION}"
            docker push "${IMAGE}:latest"

  publish-trace-viewer:
    docker:
      - image: cimg/node:22.23.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Check if trace-viewer package should be published
          command: pnpm exec jiti scripts/check-package-scope.ts trace-viewer || circleci step halt
      - run:
          name: Bump version and create local tag
          command: pnpm exec jiti scripts/bump-and-tag.ts trace-viewer
      - run:
          name: Build trace-viewer package
          command: pnpm run trace-viewer:build
      - npm-trusted-publishing
      - run:
          name: Publish trace-viewer package
          command: pnpm run trace-viewer:publish
      - push-release-tag:
          scope: trace-viewer

  publish-ui:
    docker:
      - image: cimg/node:22.23.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Check if ui package should be published
          command: pnpm exec jiti scripts/check-package-scope.ts ui || circleci step halt
      - run:
          name: Bump version and create local tag
          command: pnpm exec jiti scripts/bump-and-tag.ts ui
      - run:
          name: Build ui package
          command: pnpm run ui:build
      - npm-trusted-publishing
      - run:
          name: Publish ui package
          command: pnpm run ui:publish
      - push-release-tag:
          scope: ui

workflows:
  version: 2
  test-and-build:
    jobs:
      - test
      - audit
      - build:
          requires:
            - test
            - audit
      - publish-core:
          context:
            - NPM
          requires:
            - test
            - build
          filters:
            branches:
              only: main
      - publish-evals:
          context:
            - NPM
          requires:
            - test
            - build
          filters:
            branches:
              only: main
      - publish-stream:
          context:
            - NPM
          requires:
            - test
            - build
          filters:
            branches:
              only: main
      - publish-react:
          context:
            - NPM
          requires:
            - test
            - build
          filters:
            branches:
              only: main
      - publish-tracing:
          context:
            - NPM
          requires:
            - test
            - build
          filters:
            branches:
              only: main
      - publish-tracing-sidecar:
          context:
            - NPM
            - GHCR
          requires:
            - publish-tracing
          filters:
            branches:
              only: main
      - publish-trace-viewer:
          context:
            - NPM
          requires:
            - publish-tracing
          filters:
            branches:
              only: main
      - publish-ui:
          context:
            - NPM
          requires:
            - test
            - build
          filters:
            branches:
              only: main
